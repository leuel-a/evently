services:
    db:
        image: mongo:7.0.45
        container_name: evently_mongodb
        env_file: .env
        ports:
            - "27017:27017"
        volumes:
            - mongodata:/var/lib/postgresql/data
        healthcheck:
          test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          interval: 10s
          timeout: 10s
          retries: 5
          start_period: 40s

volumes:
    mongodata:
