services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: api
    environment:
          DATABASE_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017/evently_db?authSource=admin
    env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - db
  db:
    image: mongo:7.0.43-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    container_name: db
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

volumes:
  mongodb-data:
