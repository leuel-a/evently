services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: api
    environment:
      MONGO_USER: ${MONGO_USER:?set MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
      DATABASE_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017/evently_db?authSource=admin
    env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:7.0.43-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    container_name: db
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

volumes:
  mongodb-data:
